name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: /portfolio
  NEXT_PUBLIC_ORIGIN: https://matheusPavaneli.github.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests — locale parity and the palette's contrast floor
        run: pnpm run test

      - name: Build
        env:
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
        run: pnpm run build

      # The budget is asserted, not observed. `.unique/stack.md` records why the number is
      # what it is, and a change that pushes past it fails here instead of in production.
      - name: Bundle budget
        env:
          JS_BUDGET_KB: "135"
        run: pnpm run check:bundle

      - name: Install Chromium for the accessibility pass
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve the export
        run: |
          node scripts/serve-out.mjs out 4173 /portfolio &
          npx --yes wait-on http://localhost:4173/portfolio/en/ || sleep 5

      - name: Accessibility — axe on both locales, both themes, plus reflow
        run: node scripts/check-a11y.mjs http://localhost:4173/portfolio

      - name: Declared fallbacks — no JS, reduced motion, no form id
        run: node scripts/check-fallbacks.mjs http://localhost:4173/portfolio

      - name: Upload the artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
