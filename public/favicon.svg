<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Matheus Pavaneli">
  <!--
    One row of the delta board, at 32px: the initials, a bar for the distance a number
    travelled, and the cap at the end of it. Colours are Ink & Signal's `bg`, `text` and
    `accent-fill`, which is why the mark works on a dark tab strip and a light one alike.
  -->
  <rect width="32" height="32" rx="7" fill="#0C0C0B"/>
  <text x="6" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.3" fill="#ECE7DD">MP</text>
  <rect x="6" y="22" width="13" height="2" rx="1" fill="#C8F03C"/>
  <circle cx="21.5" cy="23" r="2.5" fill="#C8F03C"/>
</svg>
